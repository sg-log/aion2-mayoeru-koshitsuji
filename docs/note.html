<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183853"><meta name="description" content="AION2の疑問や日課などを、必要なときに検索して読み返せる小さな非公式情報サイト。"><title>AION2 まよえるこしつじ</title><link rel="stylesheet" href="./style.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="./index.html"><span class="mark">✧</span><span><small>AION2</small>まよえるこしつじ</span></a><nav class="nav"><a href="./daily.html">デイリー</a><a href="./weekly.html">ウィークリー</a><a href="./index.html#categories">カテゴリ</a></nav></div></header><main class="wrap"><article class="article"><span class="mini" id="kind">メモ</span><h1 id="title">読み込み中…</h1><div class="notice" id="answer"></div><div id="detail"></div><div id="source"></div><a class="back" href="./index.html">‹ メモ一覧に戻る</a></article></main>
<script>(async()=>{const id=new URLSearchParams(location.search).get("id");try{const r=await fetch("./data/notes.json");if(!r.ok)throw Error();const a=await r.json(),n=a.find(n=>n.id===id&&n.status==="公開中");if(!n)throw Error();document.title=n.title+" | AION2 まよえるこしつじ";document.getElementById("title").textContent=n.title;document.getElementById("kind").textContent=n.category||"メモ";document.getElementById("answer").textContent=n.summary;const d=document.getElementById("detail");if(n.details?.length){const h=document.createElement("h2");h.textContent="もう少し詳しく";d.append(h);const ul=document.createElement("ul");n.details.forEach(t=>{const li=document.createElement("li");li.textContent=t;ul.append(li)});d.append(ul)}const s=document.getElementById("source");if(n.sources?.length){const h=document.createElement("h2");h.textContent="出典";s.append(h);for(const x of n.sources){const p=document.createElement("p"),a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=x.label||x.url;p.append(a);s.append(p)}}if(n.checked_at){const p=document.createElement("p");p.className="mini";p.textContent="確認日："+n.checked_at;s.append(p)}}catch(e){document.getElementById("title").textContent="メモが見つかりません";document.getElementById("answer").textContent="URLを確認するか、トップページから検索してください。"}})();</script><footer><div class="wrap">AION2 まよえるこしつじ · 非公式の個人情報サイト</div></footer></body></html>
